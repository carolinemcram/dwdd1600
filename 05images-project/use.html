        <h1>Used For</h1>

        <div class="gallery">
            <figure>
                <img src="images/photoone.webp" alt="Diagram of Printer" width="300" height="196" loading="lazy">
                <figcaption>Diagram of Printer</figcaption>
            </figure>

            <figure>
                <img src="images/phototwo.webp" alt="Types of Drum Machines" width="300" height="199" loading="lazy">
                <figcaption>Types of Drum Machines: one drum color means the printer uses only one ink drum so the
                    entire print is made with a single ink color. Two drum colors means the printer uses two separate
                    ink drums, printing two colors in separate layers</figcaption>
            </figure>

            <figure>
                <img src="Images/photothree.webp" alt="Ink Drum Placement" width="300" height="189" loading="lazy">
                <figcaption>Ink Drums are placed inside a drum screen and case </figcaption>
            </figure>

            <figure>
                <img src="images/photofour.webp" alt="Soy Based Inks" width="300" height="220" loading="lazy">
                <figcaption>Soy Based Inks are made by extracting oil from soybeans and mixing it with pigments, resins,
                    and additives which allow the pigments to appear more vibrant and reflective on paper</figcaption>
            </figure>

            <figure>
                <img src="images/photofive.webp" alt="Masters" width="300" height="166" loading="lazy">
                <figcaption>Masters wrap around the ink drum which is used to distribute ink</figcaption>
            </figure>

            <figure>
                <img src="images/photosix.webp" alt="Ink Drum Operation" width="300" height="200" loading="lazy">
                <figcaption>Ink colors are manually placed for each round of printing</figcaption>
            </figure>

            <figure>
                <img src="images/photoseven.webp" alt="Uncoated Paper" width="300" height="193" loading="lazy">
                <figcaption>Type of paper used for risograph printing</figcaption>
            </figure>

            <figure>
                <img src="images/photoeight.webp" alt="Paper Insertion" width="300" height="296" loading="lazy">
                <figcaption>Paper gets placed in the track and printing can begin</figcaption>
            </figure>
